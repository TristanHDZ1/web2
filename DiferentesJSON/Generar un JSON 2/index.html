<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Guardar usuarios en localStorage</title>
</head>
<body>
  <h2>Formulario para guardar usuarios</h2>

  <form id="userForm">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" required><br><br>

    <label for="correo">Correo:</label>
    <input type="email" id="correo" required><br><br>

    <button type="submit">Guardar</button>
  </form>

  <h3>Usuarios guardados:</h3>
  <pre id="salidaJSON"></pre>

</body>
<script src="app.js"></script>
</html>
