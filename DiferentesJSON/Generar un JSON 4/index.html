<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Guardar usuarios en archivo JSON</title>
</head>
<body>
  <h2>Formulario para guardar usuarios</h2>

  <!-- Formulario HTML para capturar datos -->
  <form id="userForm">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" required><br><br>

    <label for="correo">Correo:</label>
    <input type="email" id="correo" required><br><br>

    <button type="submit">Guardar</button>
  </form>

  <!-- Botón para descargar el archivo JSON -->
  <button id="descargarBtn"> Descargar JSON</button>

  <!-- Área donde se muestra el JSON generado -->
  <h3>Usuarios guardados:</h3>
  <pre id="salidaJSON"></pre>


</body>
<script src="app.js"></script>
</html>
